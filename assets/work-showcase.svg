<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 530" role="img" aria-labelledby="title desc">
<title id="title">DAWAN — Selected ventures</title>
<desc id="desc">Three restrained editorial cards for NextBorder, NextBorder Import and Dawan Trade Link, using midnight navy, petrol teal, warm ivory and champagne gold with subtle motion lines and original abstract vector illustrations.</desc>
<defs>
  <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#07121C"/>
    <stop offset=".58" stop-color="#0A2029"/>
    <stop offset="1" stop-color="#082F34"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#E8D9B4"/>
    <stop offset=".52" stop-color="#D8C69A"/>
    <stop offset="1" stop-color="#B79A65"/>
  </linearGradient>
  <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#13C5C2"/>
    <stop offset="1" stop-color="#0B6C70"/>
  </linearGradient>
  <radialGradient id="glow">
    <stop offset="0" stop-color="#13C5C2" stop-opacity=".17"/>
    <stop offset="1" stop-color="#13C5C2" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grain" width="32" height="32" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#D9E6E2" opacity=".12"/>
  </pattern>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="22"/>
  </filter>
</defs>

<rect width="1440" height="530" rx="22" fill="url(#canvas)"/>
<rect width="1440" height="530" rx="22" fill="url(#grain)" opacity=".4"/>
<ellipse cx="1160" cy="80" rx="330" ry="210" fill="url(#glow)" filter="url(#blur)">
  <animate attributeName="cx" values="1080;1220;1080" dur="18s" repeatCount="indefinite"/>
</ellipse>

<g font-family="Arial, Helvetica, sans-serif">
  <text x="64" y="62" fill="#D8C69A" font-size="13" letter-spacing="4">DAWAN  /  SELECTED VENTURES</text>
  <text x="1376" y="62" fill="#94A3B8" text-anchor="end" font-size="12" letter-spacing="3">EDUCATION  ·  OPERATIONS  ·  BUSINESS</text>
</g>
<text x="64" y="128" fill="#F5F3EA" font-family="Georgia, 'Times New Roman', serif" font-size="54" letter-spacing="-1.5">Work shaped around people and systems.</text>
<text x="66" y="163" fill="#AEBCC2" font-family="Arial, Helvetica, sans-serif" font-size="17">A small selection of business and digital work in progress.</text>
<path d="M64 188H1376" stroke="#E8E6DD" stroke-opacity=".2"/>
<path d="M64 188H330" stroke="url(#gold)" stroke-width="2.5" stroke-linecap="round">
  <animate attributeName="x2" values="220;440;220" dur="12s" repeatCount="indefinite"/>
</path>

<!-- Card 01: NextBorder -->
<g>
  <rect x="54" y="218" width="424" height="250" rx="15" fill="#0B202A" stroke="#1E5960" stroke-width="1.2"/>
  <rect x="54" y="218" width="424" height="3" rx="1.5" fill="url(#teal)"/>
  <text x="82" y="256" fill="#13C5C2" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="2.5">01  /  EDUCATION &amp; MOBILITY</text>
  <text x="82" y="305" fill="#F5F3EA" font-family="Georgia, 'Times New Roman', serif" font-size="39">NextBorder</text>
  <text x="82" y="340" fill="#C5D0D2" font-family="Arial, Helvetica, sans-serif" font-size="16">Student pathways, admissions guidance</text>
  <text x="82" y="364" fill="#C5D0D2" font-family="Arial, Helvetica, sans-serif" font-size="16">and international mobility support.</text>
  <g transform="translate(355 338)">
    <circle r="61" fill="none" stroke="#D8C69A" stroke-opacity=".35" stroke-width="1.2"/>
    <circle r="46" fill="none" stroke="#13C5C2" stroke-opacity=".75" stroke-width="1.5" stroke-dasharray="2 7"/>
    <path d="M-43 14C-20 -18 6 -23 41 -4" fill="none" stroke="url(#gold)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M28 -12L42 -4L30 5" fill="none" stroke="#D8C69A" stroke-width="2"/>
    <circle cx="-43" cy="14" r="4.5" fill="#13C5C2"/>
    <circle cx="41" cy="-4" r="4.5" fill="#D8C69A"><animate attributeName="r" values="3.5;6;3.5" dur="2.8s" repeatCount="indefinite"/></circle>
    <rect x="-22" y="-18" width="44" height="36" rx="4" fill="#0D333A" stroke="#13C5C2" stroke-opacity=".8"/>
    <path d="M-12 -7H12M-12 1H8M-12 9H4" stroke="#D8C69A" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="82" y="430" fill="#D8C69A" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="1.6">STUDY ABROAD  ·  VISA GUIDANCE  ·  IELTS</text>
</g>

<!-- Card 02: NextBorder Import -->
<g>
  <rect x="508" y="218" width="424" height="250" rx="15" fill="#0B202A" stroke="#35605B" stroke-width="1.2"/>
  <rect x="508" y="218" width="424" height="3" rx="1.5" fill="url(#gold)"/>
  <text x="536" y="256" fill="#D8C69A" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="2.5">02  /  OPERATIONS</text>
  <text x="536" y="305" fill="#F5F3EA" font-family="Georgia, 'Times New Roman', serif" font-size="34">NextBorder Import</text>
  <text x="536" y="340" fill="#C5D0D2" font-family="Arial, Helvetica, sans-serif" font-size="16">Import operations dashboard and</text>
  <text x="536" y="364" fill="#C5D0D2" font-family="Arial, Helvetica, sans-serif" font-size="16">digital workflow exploration.</text>
  <g transform="translate(827 344)">
    <rect x="-60" y="-48" width="120" height="96" rx="8" fill="#0D3036" stroke="#4D7770" stroke-opacity=".8"/>
    <path d="M-43 -29H43M-43 -13H43" stroke="#D8C69A" stroke-opacity=".7" stroke-width="1.5"/>
    <g fill="#13C5C2">
      <rect x="-43" y="4" width="16" height="28" rx="3"><animate attributeName="height" values="28;37;28" dur="4s" repeatCount="indefinite"/><animate attributeName="y" values="4;-5;4" dur="4s" repeatCount="indefinite"/></rect>
      <rect x="-13" y="-1" width="16" height="33" rx="3"><animate attributeName="height" values="33;43;33" dur="4s" begin=".45s" repeatCount="indefinite"/><animate attributeName="y" values="-1;-11;-1" dur="4s" begin=".45s" repeatCount="indefinite"/></rect>
      <rect x="17" y="10" width="16" height="22" rx="3"><animate attributeName="height" values="22;31;22" dur="4s" begin=".9s" repeatCount="indefinite"/><animate attributeName="y" values="10;1;10" dur="4s" begin=".9s" repeatCount="indefinite"/></rect>
    </g>
    <circle cx="43" cy="-29" r="4" fill="#D8C69A"><animate attributeName="opacity" values=".3;1;.3" dur="2.2s" repeatCount="indefinite"/></circle>
  </g>
  <text x="536" y="430" fill="#D8C69A" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="1.6">STRUCTURE  ·  CLARITY  ·  WORKFLOWS</text>
</g>

<!-- Card 03: Dawan Trade Link -->
<g>
  <rect x="962" y="218" width="424" height="250" rx="15" fill="#0B202A" stroke="#64573F" stroke-width="1.2"/>
  <rect x="962" y="218" width="424" height="3" rx="1.5" fill="#D8C69A"/>
  <text x="990" y="256" fill="#D8C69A" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="2.5">03  /  BUSINESS &amp; BRAND</text>
  <text x="990" y="305" fill="#F5F3EA" font-family="Georgia, 'Times New Roman', serif" font-size="37">Dawan Trade Link</text>
  <text x="990" y="340" fill="#C5D0D2" font-family="Arial, Helvetica, sans-serif" font-size="16">Business initiatives and distinct</text>
  <text x="990" y="364" fill="#C5D0D2" font-family="Arial, Helvetica, sans-serif" font-size="16">brand-building directions.</text>
  <g transform="translate(1284 345)">
    <circle r="57" fill="none" stroke="#D8C69A" stroke-opacity=".35" stroke-width="1.2"/>
    <circle r="42" fill="none" stroke="#D8C69A" stroke-opacity=".85" stroke-width="1.5"/>
    <circle r="28" fill="#102832" stroke="#13C5C2" stroke-opacity=".8"/>
    <text x="0" y="12" text-anchor="middle" fill="#D8C69A" font-family="Georgia, 'Times New Roman', serif" font-size="36">D</text>
    <g>
      <circle cx="57" cy="0" r="5" fill="#13C5C2"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="22s" repeatCount="indefinite"/>
    </g>
  </g>
  <text x="990" y="430" fill="#D8C69A" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="1.6">IDENTITY  ·  TRUST  ·  EXPERIENCE</text>
</g>

<path d="M64 493H1376" stroke="#E8E6DD" stroke-opacity=".16"/>
<text x="64" y="516" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="2">SELECTED WORK  /  A CONTINUING PRACTICE</text>
<text x="1376" y="516" fill="#D8C69A" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="end" letter-spacing="2">PEOPLE  ·  PATHWAYS  ·  SYSTEMS</text>
</svg>