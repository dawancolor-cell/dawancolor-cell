<text x="64" y="125" fill="#F5F3EA" font-family="Georgia,serif" font-size="50">A connected set of interests.</text>
<text x="66" y="160" fill="#AEBCC2" font-family="Arial,sans-serif" font-size="17">Exploring tools and ideas that make digital experiences more useful.</text>
