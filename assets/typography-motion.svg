<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 400" role="img" aria-labelledby="title desc">
<title id="title">DAWAN — People, Pathways, Systems</title>
<desc id="desc">A kinetic typographic composition with staggered word reveals, a moving light sweep, orbiting nodes, animated route lines and a subtle dotted field.</desc>
<defs>
  <linearGradient id="back" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#10272A"/>
    <stop offset=".55" stop-color="#183638"/>
    <stop offset="1" stop-color="#10272A"/>
    <animate attributeName="x1" values="0;1;0" dur="14s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#C45A3C" stop-opacity="0"/>
    <stop offset=".48" stop-color="#F4F0E6" stop-opacity=".23"/>
    <stop offset="1" stop-color="#C45A3C" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="route" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#64735B"/>
    <stop offset=".52" stop-color="#C45A3C"/>
    <stop offset="1" stop-color="#D8C6A5"/>
    <animate attributeName="x1" values="0;1;0" dur="9s" repeatCount="indefinite"/>
  </linearGradient>
  <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#F4F0E6" opacity=".19"/>
  </pattern>
  <radialGradient id="warmGlow">
    <stop offset="0" stop-color="#C45A3C" stop-opacity=".26"/>
    <stop offset="1" stop-color="#C45A3C" stop-opacity="0"/>
  </radialGradient>
</defs>

<rect width="1440" height="400" rx="22" fill="url(#back)"/>
<rect width="1440" height="400" rx="22" fill="url(#grid)" opacity=".34"/>
<ellipse cx="725" cy="210" rx="330" ry="210" fill="url(#warmGlow)">
  <animate attributeName="cx" values="640;820;640" dur="12s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values=".45;.9;.45" dur="8s" repeatCount="indefinite"/>
</ellipse>

<!-- Large quiet watermark gives the composition depth without competing with the message. -->
<text x="720" y="310" text-anchor="middle" fill="#F4F0E6" opacity=".035" font-family="Georgia,serif" font-size="220" font-weight="700" letter-spacing="-14">DAWAN</text>

<!-- Moving light sweep -->
<rect x="-260" y="0" width="190" height="400" fill="url(#beam)" opacity=".7" transform="skewX(-16)">
  <animate attributeName="x" values="-260;1560" dur="8.5s" repeatCount="indefinite"/>
</rect>

<!-- Corner registration marks -->
<g stroke="#D8C6A5" stroke-width="2" fill="none" opacity=".55">
  <path d="M34 62V34H62 M1378 34H1406V62 M34 338V366H62 M1378 366H1406V338"/>
</g>
<g fill="#D8C6A5" font-family="monospace" font-size="13" letter-spacing="3" opacity=".78">
  <text x="70" y="65">A HUMAN-CENTRED PRACTICE</text>
  <text x="1370" y="65" text-anchor="end">BANGLADESH  /  2026</text>
</g>

<!-- Kinetic headline: each word enters on its own beat. -->
<g fill="#F4F0E6" font-family="Georgia, 'Times New Roman', serif" font-size="82" letter-spacing="-4">
  <g>
    <text x="68" y="178">People.</text>
    <animateTransform attributeName="transform" type="translate" values="0 22;0 0;0 0;0 -2;0 0" keyTimes="0;.16;.84;.94;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;1" keyTimes="0;.16;.92;1" dur="8s" repeatCount="indefinite"/>
  </g>
</g>
<g fill="#C45A3C" font-family="Georgia, 'Times New Roman', serif" font-size="82" font-style="italic" letter-spacing="-5">
  <g>
    <text x="485" y="178">Pathways.</text>
    <animateTransform attributeName="transform" type="translate" values="0 25;0 0;0 0;0 -2;0 0" keyTimes="0;.23;.84;.94;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;1" keyTimes="0;.23;.92;1" dur="8s" repeatCount="indefinite"/>
  </g>
</g>
<g fill="#F4F0E6" font-family="Georgia, 'Times New Roman', serif" font-size="82" letter-spacing="-4">
  <g>
    <text x="1010" y="178">Systems.</text>
    <animateTransform attributeName="transform" type="translate" values="0 28;0 0;0 0;0 -2;0 0" keyTimes="0;.30;.84;.94;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;1" keyTimes="0;.30;.92;1" dur="8s" repeatCount="indefinite"/>
  </g>
</g>

<!-- Small editorial markers -->
<g font-family="monospace" font-size="12" letter-spacing="2" fill="#D8C6A5">
  <text x="72" y="211">01 / PEOPLE</text>
  <text x="490" y="211">02 / POSSIBILITY</text>
  <text x="1015" y="211">03 / PROGRESS</text>
</g>
<g stroke="#64735B" stroke-width="1.5" opacity=".85">
  <path d="M72 226H320"><animate attributeName="stroke-dasharray" values="0 248;248 0;248 0" dur="8s" repeatCount="indefinite"/></path>
  <path d="M490 226H820"><animate attributeName="stroke-dasharray" values="0 330;330 0;330 0" begin=".45s" dur="8s" repeatCount="indefinite"/></path>
  <path d="M1015 226H1368"><animate attributeName="stroke-dasharray" values="0 353;353 0;353 0" begin=".9s" dur="8s" repeatCount="indefinite"/></path>
</g>

<!-- Route line and travelling signal -->
<path d="M70 300 C250 250 345 350 520 300 S820 255 990 300 S1220 347 1370 292" fill="none" stroke="#64735B" stroke-width="3" opacity=".45"/>
<path d="M70 300 C250 250 345 350 520 300 S820 255 990 300 S1220 347 1370 292" fill="none" stroke="url(#route)" stroke-width="4" stroke-linecap="round" stroke-dasharray="130 1200">
  <animate attributeName="stroke-dashoffset" values="1320;0" dur="6.5s" repeatCount="indefinite"/>
</path>

<!-- Orbiting nodes: a small motion system around the idea of connection. -->
<g transform="translate(720 300)">
  <circle r="54" fill="none" stroke="#D8C6A5" stroke-opacity=".22" stroke-width="1.5" stroke-dasharray="4 9"/>
  <circle r="37" fill="none" stroke="#C45A3C" stroke-opacity=".55" stroke-width="1.5"/>
  <g>
    <circle cx="54" cy="0" r="6" fill="#C45A3C"/>
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="7s" repeatCount="indefinite"/>
  </g>
  <g>
    <circle cx="-37" cy="0" r="4" fill="#F4F0E6"/>
    <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="11s" repeatCount="indefinite"/>
  </g>
  <circle r="5" fill="#D8C6A5">
    <animate attributeName="r" values="4;7;4" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".55;1;.55" dur="2.6s" repeatCount="indefinite"/>
  </circle>
</g>

<!-- Quiet moving particles -->
<g fill="#F4F0E6">
  <circle cx="360" cy="274" r="2.5" opacity=".65"><animate attributeName="cy" values="274;260;274" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="1110" cy="270" r="2" opacity=".6"><animate attributeName="cy" values="270;284;270" dur="3.8s" repeatCount="indefinite"/></circle>
  <circle cx="1285" cy="320" r="2.5" opacity=".6"><animate attributeName="cx" values="1285;1300;1285" dur="4.2s" repeatCount="indefinite"/></circle>
  <circle cx="190" cy="330" r="2" opacity=".6"><animate attributeName="cx" values="190;205;190" dur="3.4s" repeatCount="indefinite"/></circle>
</g>

<g fill="#D8C6A5" font-family="monospace" font-size="11" letter-spacing="2" opacity=".82">
  <text x="70" y="370">PEOPLE  /  PATHWAYS  /  SYSTEMS</text>
  <text x="1370" y="370" text-anchor="end">THOUGHTFUL BY DESIGN</text>
</g>
<path d="M70 382H1370" stroke="#F4F0E6" stroke-opacity=".18"/>
</svg>