  <path d="M104 260h16M112 252v16M105 253l14 14" stroke="#13C5C2" stroke-width="1.5" stroke-linecap="round"/>
  <text x="150" y="256" fill="#13C5C2" font-family="Arial,sans-serif" font-size="11" letter-spacing="2">01  /  FOLLOW THE WORK</text>
  <text x="94" y="316" fill="#F5F3EA" font-family="Georgia,serif" font-size="30">GitHub activity</text>
  <text x="94" y="350" fill="#AEBCC2" font-family="Arial,sans-serif" font-size="15">Projects · Repositories · Progress</text>
  <text x="94" y="391" fill="#D8C69A" font-family="Arial,sans-serif" font-size="12" letter-spacing="2">LIVE ON GITHUB  ↗</text>
</g>
<g>
  <rect x="515" y="202" width="410" height="218" rx="14" fill="#0B202A" stroke="#64573F"/>
  <path d="M515 216Q515 202 529 202H911" stroke="#D8C69A" stroke-width="3" fill="none"/>
  <circle cx="563" cy="260" r="22" fill="#302B23" stroke="#D8C69A" stroke-opacity=".7"/>
  <path d="M553 261h20M563 251v20M556 254l14 14" stroke="#D8C69A" stroke-width="1.5" stroke-linecap="round"/>
  <text x="601" y="256" fill="#D8C69A" font-family="Arial,sans-serif" font-size="11" letter-spacing="2">02  /  BUILD TOGETHER</text>
  <text x="545" y="316" fill="#F5F3EA" font-family="Georgia,serif" font-size="30">Open collaboration</text>
  <text x="545" y="350" fill="#AEBCC2" font-family="Arial,sans-serif" font-size="15">AI · Learning · Frontend · Systems</text>
  <text x="545" y="391" fill="#D8C69A" font-family="Arial,sans-serif" font-size="12" letter-spacing="2">IDEAS INTO USEFUL THINGS</text>
</g>
<g>
  <rect x="966" y="202" width="410" height="218" rx="14" fill="#0B202A" stroke="#1E5960"/>
  <path d="M966 216Q966 202 980 202H1362" stroke="url(#accent)" stroke-width="3" fill="none"/>
  <circle cx="1014" cy="260" r="22" fill="#0E3339" stroke="#13C5C2" stroke-opacity=".7"/>
