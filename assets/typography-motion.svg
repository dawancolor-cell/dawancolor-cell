<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 400" role="img" aria-labelledby="title desc">
<title id="title">DAWAN — People. Pathways. Systems.</title>
<desc id="desc">A calm, cinematic typographic motion composition in midnight navy, petrol teal, warm ivory and champagne gold, with fine aurora lines and restrained moving light.</desc>
<defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#07121C"/>
    <stop offset=".58" stop-color="#0A2029"/>
    <stop offset="1" stop-color="#082F34"/>
    <animate attributeName="x1" values="0;1;0" dur="18s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="ivory" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#F5F3EA"/>
    <stop offset=".58" stop-color="#E8E6DD"/>
    <stop offset="1" stop-color="#D8C69A"/>
  </linearGradient>
  <linearGradient id="tealLine" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#13C5C2" stop-opacity="0"/>
    <stop offset=".48" stop-color="#13C5C2" stop-opacity=".8"/>
    <stop offset="1" stop-color="#13C5C2" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#D8C69A" stop-opacity="0"/>
    <stop offset=".5" stop-color="#D8C69A" stop-opacity=".7"/>
    <stop offset="1" stop-color="#D8C69A" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="ambient">
    <stop offset="0" stop-color="#13C5C2" stop-opacity=".2"/>
    <stop offset="1" stop-color="#13C5C2" stop-opacity="0"/>
  </radialGradient>
  <filter id="softGlow" x="-40%" y="-80%" width="180%" height="260%">
    <feGaussianBlur stdDeviation="18"/>
  </filter>
  <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#D9E6E2" opacity=".14"/>
  </pattern>
</defs>

<rect width="1440" height="400" rx="20" fill="url(#background)"/>
<rect width="1440" height="400" rx="20" fill="url(#dots)" opacity=".42"/>
<ellipse cx="1120" cy="80" rx="360" ry="250" fill="url(#ambient)" filter="url(#softGlow)">
  <animate attributeName="cx" values="1020;1220;1020" dur="19s" repeatCount="indefinite"/>
  <animate attributeName="cy" values="72;130;72" dur="16s" repeatCount="indefinite"/>
</ellipse>

<!-- Fine atmospheric paths: movement stays behind the words. -->
<g fill="none" stroke-linecap="round">
  <path d="M-80 300 C180 190 340 360 610 260 S1080 185 1520 280" stroke="#13C5C2" stroke-opacity=".32" stroke-width="34" filter="url(#softGlow)">
    <animate attributeName="d" values="M-80 300 C180 190 340 360 610 260 S1080 185 1520 280;M-80 270 C180 230 340 320 610 290 S1080 150 1520 250;M-80 300 C180 190 340 360 610 260 S1080 185 1520 280" dur="18s" repeatCount="indefinite"/>
  </path>
  <path d="M-80 300 C180 190 340 360 610 260 S1080 185 1520 280" stroke="url(#tealLine)" stroke-width="1.5" stroke-dasharray="2 15">
    <animate attributeName="stroke-dashoffset" values="0;-170" dur="13s" repeatCount="indefinite"/>
  </path>
  <path d="M-70 350 C210 295 410 390 700 325 S1150 265 1510 335" stroke="url(#goldLine)" stroke-width="1.4" stroke-dasharray="2 22">
    <animate attributeName="stroke-dashoffset" values="0;190" dur="16s" repeatCount="indefinite"/>
  </path>
</g>

<!-- Restrained moving light sweep. -->
<rect x="-230" y="40" width="110" height="320" fill="url(#tealLine)" opacity=".34" transform="skewX(-18)">
  <animate attributeName="x" values="-230;1580" dur="16s" repeatCount="indefinite"/>
</rect>

<!-- Editorial framing. -->
<path d="M58 58V36H80 M1360 36H1382V58 M58 342V364H80 M1360 364H1382V342" fill="none" stroke="#D8C69A" stroke-opacity=".56" stroke-width="1.5"/>
<text x="78" y="74" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="3">A HUMAN-CENTRED PRACTICE</text>
<text x="1360" y="74" text-anchor="end" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="3">DAWAN  /  PERSONAL FIELD NOTES</text>

<!-- Three deliberate typographic beats. -->
<g font-family="Georgia, 'Times New Roman', serif" font-size="82" letter-spacing="-2">
  <text x="76" y="190" fill="#F5F3EA" opacity="0">
    People.
    <animate attributeName="opacity" values="0;1;1" keyTimes="0;.18;1" dur="8s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 18;0 0;0 0" keyTimes="0;.18;1" dur="8s" repeatCount="indefinite"/>
  </text>
  <text x="480" y="190" fill="#D8C69A" font-style="italic" opacity="0">
    Pathways.
    <animate attributeName="opacity" values="0;1;1" keyTimes="0;.27;1" dur="8s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 22;0 0;0 0" keyTimes="0;.27;1" dur="8s" repeatCount="indefinite"/>
  </text>
  <text x="1000" y="190" fill="#F5F3EA" opacity="0">
    Systems.
    <animate attributeName="opacity" values="0;1;1" keyTimes="0;.36;1" dur="8s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 26;0 0;0 0" keyTimes="0;.36;1" dur="8s" repeatCount="indefinite"/>
  </text>
</g>

<g font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="2.5" fill="#94A3B8">
  <text x="80" y="220">01  /  PEOPLE</text>
  <text x="484" y="220">02  /  POSSIBILITY</text>
  <text x="1004" y="220">03  /  PROGRESS</text>
</g>

<path d="M78 252H1360" stroke="#E8E6DD" stroke-opacity=".16" stroke-width="1"/>
<path d="M78 252H360" stroke="url(#goldLine)" stroke-width="2.5" stroke-linecap="round">
  <animate attributeName="x2" values="170;520;170" dur="10s" repeatCount="indefinite"/>
</path>

<text x="80" y="310" fill="#E8E6DD" font-family="Arial, Helvetica, sans-serif" font-size="21" letter-spacing="1.2">Turning complex ideas into useful systems.</text>
<text x="1360" y="310" text-anchor="end" fill="#D8C69A" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="2.5">THOUGHTFUL BY DESIGN</text>

<!-- Small, low-contrast connection points. -->
<g fill="#13C5C2">
  <circle cx="342" cy="344" r="2.5" opacity=".6"><animate attributeName="cy" values="344;335;344" dur="4.2s" repeatCount="indefinite"/></circle>
  <circle cx="820" cy="334" r="2" opacity=".5"><animate attributeName="cy" values="334;344;334" dur="5s" repeatCount="indefinite"/></circle>
  <circle cx="1190" cy="350" r="2.5" opacity=".55"><animate attributeName="cx" values="1190;1204;1190" dur="4.6s" repeatCount="indefinite"/></circle>
</g>
<path d="M80 364H1360" stroke="#D8C69A" stroke-opacity=".2" stroke-width="1"/>
</svg>