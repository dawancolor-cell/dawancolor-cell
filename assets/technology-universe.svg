<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 620" role="img" aria-labelledby="title desc">
<title id="title">DAWAN technology universe</title>
<desc id="desc">An editorial map of technology interests: AI and automation, frontend and interaction, cloud and infrastructure, education technology, and product and brand systems. Tools are shown as areas of exploration, not proficiency ratings.</desc>
