<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 680" role="img" aria-labelledby="title desc">
<title id="title">Ishak Dawan, Founder and CEO of Next Border</title>
<desc id="desc">A vivid animated founder story for Next Border, featuring its official dark cinematic background language: a near-black navy and teal canvas, slow aurora-like glow fields, flowing light ribbons, radial sweep, drifting particles and a soft vignette. Foreground typography carries the tagline Crossing Boundaries. Building Futures., with global pathway graphics and the company's study, scholarship, visa guidance, EU work pathway and free IELTS focus.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0A0A0B"/><stop offset=".46" stop-color="#09131D"/><stop offset="1" stop-color="#091E1F"/>
    <animate attributeName="x1" values="0;1;0" dur="18s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#4EE2E5"/><stop offset=".24" stop-color="#63E6A5"/><stop offset=".48" stop-color="#FFD16B"/><stop offset=".72" stop-color="#FF806B"/><stop offset="1" stop-color="#B69BFF"/>
    <animate attributeName="x1" values="0;1;0" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="1;0;1" dur="9s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FFFFFF"/><stop offset=".36" stop-color="#B9F7F2"/><stop offset=".62" stop-color="#FFD17B"/><stop offset="1" stop-color="#FF8D78"/>
    <animate attributeName="x1" values="0;1;0" dur="7s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="routeGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#4EE2E5"/><stop offset=".45" stop-color="#A68DFF"/><stop offset="1" stop-color="#FF8A70"/>
  </linearGradient>
  <radialGradient id="aura">
    <stop offset="0" stop-color="#4EE2E5" stop-opacity=".34"/><stop offset=".5" stop-color="#009193" stop-opacity=".19"/><stop offset="1" stop-color="#009193" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="orangeAura">
    <stop offset="0" stop-color="#C9A84C" stop-opacity=".23"/><stop offset=".55" stop-color="#FF806B" stop-opacity=".1"/><stop offset="1" stop-color="#FF806B" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="violetAura">
    <stop offset="0" stop-color="#9A8BFF" stop-opacity=".2"/><stop offset=".56" stop-color="#4EE2E5" stop-opacity=".06"/><stop offset="1" stop-color="#4EE2E5" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="ambientTeal" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#009193" stop-opacity="0"/>
    <stop offset=".48" stop-color="#4EE2E5" stop-opacity=".62"/>
    <stop offset="1" stop-color="#009193" stop-opacity="0"/>
    <animate attributeName="x1" values="0;1;0" dur="13s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="ambientWarm" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#C9A84C" stop-opacity="0"/>
    <stop offset=".5" stop-color="#FF806B" stop-opacity=".48"/>
    <stop offset="1" stop-color="#C9A84C" stop-opacity="0"/>
  </linearGradient>
  <filter id="ambientBlur" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="34"/>
  </filter>
  <filter id="ribbonBlur" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="12"/>
  </filter>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
    <path d="M36 0H0V36" fill="none" stroke="#C5E9F2" stroke-opacity=".07" stroke-width="1"/>
    <circle cx="0" cy="0" r="1.5" fill="#C5E9F2" opacity=".25"/>
  </pattern>
  <filter id="blur24" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="24"/></filter>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="round"><rect width="1440" height="680" rx="28"/></clipPath>
</defs>
<g clip-path="url(#round)">
<rect width="1440" height="680" rx="28" fill="url(#bg)"/>

<!-- Ambient canvas-inspired background: layered light fields, fluid ribbons and drifting particles -->
<g opacity=".95">
  <ellipse cx="250" cy="185" rx="430" ry="185" fill="url(#aura)" filter="url(#ambientBlur)">
    <animate attributeName="cx" values="180;410;180" dur="17s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="170;245;170" dur="13s" repeatCount="indefinite"/>
    <animate attributeName="rx" values="340;470;340" dur="16s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="1115" cy="260" rx="410" ry="255" fill="url(#violetAura)" filter="url(#ambientBlur)">
    <animate attributeName="cx" values="1090;1270;1090" dur="19s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="235;355;235" dur="15s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="590" cy="600" rx="470" ry="135" fill="url(#orangeAura)" filter="url(#ambientBlur)">
    <animate attributeName="cx" values="420;780;420" dur="21s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="610;545;610" dur="14s" repeatCount="indefinite"/>
  </ellipse>
</g>
<rect width="1440" height="680" fill="url(#grid)" opacity=".52"/>

<!-- Slow, flowing aurora sheets mimic the site's scroll-video canvas -->
<g fill="none" stroke-linecap="round">
  <path d="M-120 240 C140 60 350 360 610 205 S1080 65 1550 250" stroke="url(#ambientTeal)" stroke-width="116" opacity=".075" filter="url(#ribbonBlur)">
    <animate attributeName="d" values="M-120 240 C140 60 350 360 610 205 S1080 65 1550 250;M-120 305 C170 100 370 310 630 255 S1120 120 1550 180;M-120 240 C140 60 350 360 610 205 S1080 65 1550 250" dur="17s" repeatCount="indefinite"/>
  </path>
  <path d="M-90 520 C180 330 400 640 710 460 S1190 340 1540 520" stroke="url(#ambientWarm)" stroke-width="92" opacity=".08" filter="url(#ribbonBlur)">
    <animate attributeName="d" values="M-90 520 C180 330 400 640 710 460 S1190 340 1540 520;M-90 455 C180 390 430 565 730 520 S1190 390 1540 440;M-90 520 C180 330 400 640 710 460 S1190 340 1540 520" dur="19s" repeatCount="indefinite"/>
  </path>
  <path d="M-70 90 C250 185 420 5 720 110 S1180 185 1500 65" stroke="#4EE2E5" stroke-width="1.5" opacity=".19" stroke-dasharray="3 18">
    <animate attributeName="stroke-dashoffset" values="0;-168" dur="12s" repeatCount="indefinite"/>
  </path>
  <path d="M-70 590 C240 475 440 660 730 565 S1170 490 1510 605" stroke="#C9A84C" stroke-width="1.3" opacity=".2" stroke-dasharray="2 22">
    <animate attributeName="stroke-dashoffset" values="0;192" dur="14s" repeatCount="indefinite"/>
  </path>
</g>

<!-- Slow-moving radial light sweep, like the site's atmospheric canvas -->
<rect x="-310" y="-20" width="190" height="740" fill="url(#ambientTeal)" opacity=".16" filter="url(#ambientBlur)" transform="skewX(-18)">
  <animate attributeName="x" values="-310;1580" dur="14s" repeatCount="indefinite"/>
</rect>
<rect x="-420" y="-20" width="90" height="740" fill="#FFFFFF" opacity=".035" transform="skewX(-18)">
  <animate attributeName="x" values="-420;1570" dur="11s" repeatCount="indefinite"/>
</rect>

<!-- Drifting canvas particles and tiny glow points -->
<g fill="#DDFBFA">
  <circle cx="152" cy="278" r="2.5" opacity=".45"><animate attributeName="cy" values="278;252;278" dur="4.8s" repeatCount="indefinite"/><animate attributeName="opacity" values=".18;.72;.18" dur="4.8s" repeatCount="indefinite"/></circle>
  <circle cx="332" cy="104" r="2" opacity=".42"><animate attributeName="cx" values="332;362;332" dur="6.2s" repeatCount="indefinite"/></circle>
  <circle cx="540" cy="268" r="2.8" opacity=".36"><animate attributeName="cy" values="268;292;268" dur="5.2s" repeatCount="indefinite"/></circle>
  <circle cx="815" cy="104" r="2" opacity=".45"><animate attributeName="cy" values="104;82;104" dur="4.4s" repeatCount="indefinite"/></circle>
  <circle cx="1285" cy="178" r="2.4" opacity=".54"><animate attributeName="cx" values="1285;1258;1285" dur="5.7s" repeatCount="indefinite"/></circle>
  <circle cx="1290" cy="488" r="2" opacity=".4"><animate attributeName="cy" values="488;458;488" dur="6.4s" repeatCount="indefinite"/></circle>
  <circle cx="910" cy="540" r="2.5" opacity=".38"><animate attributeName="cx" values="910;940;910" dur="5.4s" repeatCount="indefinite"/></circle>
  <circle cx="210" cy="572" r="1.8" opacity=".35"><animate attributeName="cy" values="572;548;572" dur="4.9s" repeatCount="indefinite"/></circle>
</g>

<!-- Background grid fades at the edges, echoing Next Border's cinematic vignette -->
<rect width="1440" height="680" fill="#05090F" opacity=".12"/>
<ellipse cx="720" cy="340" rx="950" ry="520" fill="none" stroke="#4EE2E5" stroke-opacity=".055" stroke-width="90" filter="url(#ambientBlur)"/>

<!-- Existing luminous route field -->
<ellipse cx="1110" cy="286" rx="390" ry="330" fill="url(#aura)" filter="url(#blur24)"><animate attributeName="cx" values="1060;1180;1060" dur="13s" repeatCount="indefinite"/></ellipse>
<ellipse cx="270" cy="575" rx="310" ry="170" fill="url(#orangeAura)" filter="url(#blur24)"><animate attributeName="cy" values="560;610;560" dur="10s" repeatCount="indefinite"/></ellipse>

<!-- Moving spectral light ribbons -->
<path d="M-100 174 C250 90 410 250 700 150 S1150 70 1540 175" fill="none" stroke="url(#spectrum)" stroke-width="2" opacity=".35" stroke-dasharray="2 18">
  <animate attributeName="stroke-dashoffset" values="0;-160" dur="9s" repeatCount="indefinite"/>
</path>
<path d="M-100 188 C250 104 410 264 700 164 S1150 84 1540 189" fill="none" stroke="url(#spectrum)" stroke-width="1" opacity=".18">
  <animate attributeName="stroke-dasharray" values="0 220;220 0;0 220" dur="10s" repeatCount="indefinite"/>
</path>

<!-- Header -->
<g font-family="Arial, sans-serif" letter-spacing="3">
  <text x="66" y="64" fill="#9FB8C8" font-size="14">FOUNDER'S NOTE  /  GLOBAL EDUCATION &amp; MOBILITY</text>
  <text x="1374" y="64" fill="#9FB8C8" font-size="14" text-anchor="end">BANGLADESH  ·  BUILT FOR THE WORLD</text>
</g>
<rect x="66" y="83" width="1308" height="2" fill="#D8EAF2" opacity=".17"/>
<rect x="66" y="83" width="260" height="3" rx="2" fill="url(#spectrum)">
  <animate attributeName="width" values="180;520;180" dur="8s" repeatCount="indefinite"/>
</rect>

<!-- Main kinetic typography -->
<g font-family="'Arial Black', Impact, 'DejaVu Sans', sans-serif" font-weight="900" letter-spacing="-4">
  <text x="66" y="205" font-size="114" fill="#F7FBFF" opacity="0">
    CROSSING
    <animate attributeName="opacity" values="0;1;1;1" keyTimes="0;.12;.9;1" dur="8s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 32;0 0;0 0" keyTimes="0;.14;1" dur="8s" repeatCount="indefinite"/>
  </text>
  <text x="62" y="319" font-size="126" fill="url(#titleGrad)" opacity="0">
    BOUNDARIES.
    <animate attributeName="opacity" values="0;1;1;1" keyTimes="0;.23;.9;1" dur="8s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 40;0 0;0 0" keyTimes="0;.25;1" dur="8s" repeatCount="indefinite"/>
  </text>
</g>
<path d="M70 344H770" stroke="url(#spectrum)" stroke-width="5" stroke-linecap="round" stroke-dasharray="0 700">
  <animate attributeName="stroke-dasharray" values="0 700;700 0;700 0" dur="8s" repeatCount="indefinite"/>
</path>
<text x="70" y="394" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-style="italic" fill="#D8EAF2" opacity=".94">
  Building futures.
  <animate attributeName="opacity" values=".3;1;.9;1" dur="5s" repeatCount="indefinite"/>
</text>

<!-- Founder identity -->
<g>
  <rect x="70" y="438" width="8" height="74" rx="4" fill="url(#spectrum)"/>
  <text x="98" y="462" fill="#8EA9BA" font-family="Arial, sans-serif" font-size="14" letter-spacing="3">FOUNDER &amp; CEO  /  NEXT BORDER</text>
  <text x="98" y="505" fill="#FFFFFF" font-family="Georgia, 'Times New Roman', serif" font-size="40">Ishak Dawan</text>
  <text x="100" y="537" fill="#C2D5E1" font-family="Arial, sans-serif" font-size="17">Turning ambition into clearer pathways for people.</text>
</g>

<!-- Global route orb on the right -->
<g transform="translate(1100 300)">
  <circle r="215" fill="url(#aura)" opacity=".65"/>
  <circle r="185" fill="none" stroke="#A6C7D6" stroke-opacity=".18" stroke-width="1.5" stroke-dasharray="3 12">
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="90s" repeatCount="indefinite"/>
  </circle>
  <circle r="158" fill="none" stroke="url(#spectrum)" stroke-opacity=".72" stroke-width="2" stroke-dasharray="170 28 70 26 110 590">
    <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="35s" repeatCount="indefinite"/>
  </circle>
  <ellipse rx="145" ry="61" fill="none" stroke="#78D9DF" stroke-opacity=".34" stroke-width="1.5" transform="rotate(-28)"/>
  <ellipse rx="145" ry="61" fill="none" stroke="#A78BFA" stroke-opacity=".35" stroke-width="1.5" transform="rotate(48)"/>
  <ellipse rx="145" ry="61" fill="none" stroke="#FF9C77" stroke-opacity=".25" stroke-width="1.5" transform="rotate(90)"/>
  <path d="M-132 -24 C-70 -132 42 -120 128 -40 S86 80 12 24 S-52 104 -132 70" fill="none" stroke="url(#routeGrad)" stroke-width="3" stroke-linecap="round" stroke-dasharray="18 13" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" values="0;-124" dur="5s" repeatCount="indefinite"/>
  </path>
  <path d="M-132 -24 C-70 -132 42 -120 128 -40 S86 80 12 24 S-52 104 -132 70" fill="none" stroke="#FFFFFF" stroke-opacity=".6" stroke-width="1" stroke-dasharray="2 90">
    <animate attributeName="stroke-dashoffset" values="0;-184" dur="3s" repeatCount="indefinite"/>
  </path>
  <g filter="url(#glow)">
    <circle cx="-132" cy="-24" r="7" fill="#4EE2E5"><animate attributeName="r" values="5;10;5" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="128" cy="-40" r="7" fill="#FF9A71"><animate attributeName="r" values="5;10;5" begin=".5s" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="12" cy="24" r="6" fill="#B69BFF"><animate attributeName="r" values="4;9;4" begin="1s" dur="2s" repeatCount="indefinite"/></circle>
  </g>
  <circle r="88" fill="#0A1927" stroke="#8FE6E8" stroke-opacity=".5" stroke-width="2"/>
  <circle r="77" fill="none" stroke="url(#spectrum)" stroke-width="3" stroke-dasharray="210 18 95 18">
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
  </circle>
  <text x="0" y="10" text-anchor="middle" fill="#FFFFFF" font-family="'Arial Black', Impact, sans-serif" font-size="64" letter-spacing="-4">NB</text>
  <text x="0" y="42" text-anchor="middle" fill="#8FE6E8" font-family="Arial, sans-serif" font-size="10" letter-spacing="3">NEXT BORDER</text>
  <g font-family="Arial, sans-serif" font-size="12" letter-spacing="2" fill="#D5E9F2">
    <text x="-210" y="-188">DHAKA</text><text x="150" y="-172">EUROPE</text><text x="164" y="198">USA</text>
  </g>
  <circle cx="-176" cy="-165" r="3.5" fill="#4EE2E5"><animate attributeName="opacity" values=".25;1;.25" dur="2.4s" repeatCount="indefinite"/></circle>
  <circle cx="190" cy="-152" r="3.5" fill="#FFD16B"><animate attributeName="opacity" values=".25;1;.25" begin=".6s" dur="2.4s" repeatCount="indefinite"/></circle>
  <circle cx="198" cy="177" r="3.5" fill="#FF806B"><animate attributeName="opacity" values=".25;1;.25" begin="1.2s" dur="2.4s" repeatCount="indefinite"/></circle>
</g>

<!-- Floating markers -->
<g fill="#E6F7FF">
  <circle cx="860" cy="150" r="3" opacity=".6"><animate attributeName="cy" values="150;132;150" dur="4s" repeatCount="indefinite"/></circle>
  <circle cx="1325" cy="220" r="2.5" opacity=".7"><animate attributeName="cx" values="1325;1307;1325" dur="5s" repeatCount="indefinite"/></circle>
  <circle cx="906" cy="430" r="2.5" opacity=".5"><animate attributeName="cy" values="430;445;430" dur="4.4s" repeatCount="indefinite"/></circle>
</g>

<!-- Service strip -->
<rect x="0" y="576" width="1440" height="104" fill="#07111C" opacity=".88"/>
<rect x="0" y="576" width="1440" height="3" fill="url(#spectrum)"/>
<g font-family="Arial, sans-serif">
  <text x="66" y="610" fill="#8FA8B8" font-size="12" letter-spacing="3">THE NEXT BORDER MISSION</text>
  <g font-size="18" font-weight="700" letter-spacing="1.2" fill="#F5FAFC">
    <text x="66" y="649">STUDY ABROAD</text>
    <text x="320" y="649" fill="#4EE2E5">✦</text>
    <text x="365" y="649">SCHOLARSHIPS</text>
    <text x="610" y="649" fill="#FFD16B">✦</text>
    <text x="656" y="649">VISA GUIDANCE</text>
    <text x="895" y="649" fill="#FF806B">✦</text>
    <text x="940" y="649">EU WORK PATHWAYS</text>
    <text x="1210" y="649" fill="#B69BFF">✦</text>
    <text x="1254" y="649" font-size="16">FREE IELTS</text>
  </g>
</g>

<!-- Sweep highlights the section once per cycle -->
<rect x="-230" y="90" width="130" height="450" fill="#FFFFFF" opacity=".055" transform="skewX(-18)">
  <animate attributeName="x" values="-230;1580" dur="10s" repeatCount="indefinite"/>
</rect>
</g>
</svg>