name: Render DAWAN founder background motion

concurrency:
  group: dawan-profile-motion
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "assets/nextborder-founder-motion.svg"
      - "scripts/render_profile_motion.mjs"
      - ".github/workflows/render-profile-motion.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-founder-banner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install browser renderer
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Install optimized GIF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg gifsicle

      - name: Render founder motion frames
        run: node scripts/render_profile_motion.mjs

      - name: Encode mobile-friendly founder GIF
        run: |
          ffmpeg -y -framerate 8 -i founder-frames/frame-%03d.png \
            -filter_complex "[0:v]fps=8,scale=720:-1:flags=lanczos,split[s0][s1];[s0]palettegen=max_colors=64:stats_mode=diff[p];[s1][p]paletteuse=dither=bayer" \
            -loop 0 /tmp/nextborder-founder-raw.gif
          gifsicle --optimize=3 --lossy=70 /tmp/nextborder-founder-raw.gif \
            -o assets/nextborder-founder-motion.gif
          ls -lh assets/nextborder-founder-motion.gif

      - name: Switch founder image to generated GIF
        run: |
          python - <<'PY'
          from pathlib import Path
          readme = Path("README.md")
          content = readme.read_text()
          source = '<img src="assets/nextborder-founder-motion.svg" alt="Ishak Dawan, Founder and CEO of Next Border. Crossing Boundaries. Building Futures." width="100%"/>'
          rendered = '<img src="assets/nextborder-founder-motion.gif" alt="Ishak Dawan, Founder and CEO of Next Border. Crossing Boundaries. Building Futures." width="100%"/>'
          readme.write_text(content.replace(source, rendered))
          PY

      - name: Publish optimized founder animation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/nextborder-founder-motion.gif README.md
          if git diff --cached --quiet; then
            echo "The founder animation is already up to date."
          else
            git commit -m "Publish Next Border founder background animation"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
