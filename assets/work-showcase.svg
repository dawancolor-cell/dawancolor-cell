<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 540" role="img" aria-labelledby="title desc">
<title id="title">DAWAN selected work</title>
<desc id="desc">Three editorial project cards for education access, operations systems and business brand building, connected by mobile-optimized animated route lines and geometric signals.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10272A"/><stop offset=".6" stop-color="#19383A"/><stop offset="1" stop-color="#10272A"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C45A3C"/><stop offset=".5" stop-color="#D8C6A5"/><stop offset="1" stop-color="#81927A"/></linearGradient>
  <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C45A3C" stop-opacity=".22"/><stop offset="1" stop-color="#C45A3C" stop-opacity="0"/></linearGradient>
  <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#F4F0E6" opacity=".15"/></pattern>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="20"/></filter>
</defs>
<rect width="1440" height="540" rx="24" fill="url(#bg)"/><rect width="1440" height="540" rx="24" fill="url(#dots)" opacity=".42"/>
<ellipse cx="1130" cy="85" rx="250" ry="150" fill="url(#glow)" filter="url(#soft)"><animate attributeName="cx" values="1080;1190;1080" dur="12s" repeatCount="indefinite"/><animate attributeName="opacity" values=".55;.95;.55" dur="7s" repeatCount="indefinite"/></ellipse>
<g fill="#D8C6A5" font-family="Arial, sans-serif" font-size="15" letter-spacing="3"><text x="62" y="60">DAWAN  /  SELECTED WORK</text><text x="1378" y="60" text-anchor="end">FIELD NOTES  ·  2026</text></g>
<text x="62" y="126" fill="#F4F0E6" font-family="Georgia, 'Times New Roman', serif" font-size="54" letter-spacing="-1.5">A few things taking shape.</text>
<text x="1378" y="118" text-anchor="end" fill="#AFC0B4" font-family="Arial, sans-serif" font-size="15" letter-spacing="2">EDUCATION  /  OPERATIONS  /  BRAND</text>
<path d="M62 148H1378" stroke="#F4F0E6" stroke-opacity=".2"/><path d="M62 148H370" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-dasharray="90 250"><animate attributeName="stroke-dashoffset" values="340;0" dur="6s" repeatCount="indefinite"/></path>
<g><rect x="48" y="178" width="430" height="294" rx="18" fill="#173437" stroke="#55706B" stroke-opacity=".65"/><rect x="48" y="178" width="430" height="4" rx="2" fill="#C45A3C"/>
<g font-family="Arial, sans-serif" fill="#D8C6A5" font-size="13" letter-spacing="2.2"><text x="78" y="220">01  /  EDUCATION</text><text x="446" y="220" text-anchor="end" fill="#81927A">STUDENT PATHWAYS</text></g>
<text x="78" y="276" fill="#F4F0E6" font-family="Georgia, serif" font-size="40">NextBorder</text><text x="78" y="310" fill="#B8C7BD" font-family="Arial, sans-serif" font-size="17">Making international study journeys</text><text x="78" y="334" fill="#B8C7BD" font-family="Arial, sans-serif" font-size="17">clearer, more human and accessible.</text>
<path d="M80 398 C145 362 196 437 258 396 S370 366 438 399" fill="none" stroke="#81927A" stroke-width="2" stroke-opacity=".6"/><path d="M80 398 C145 362 196 437 258 396 S370 366 438 399" fill="none" stroke="#D8C6A5" stroke-width="3" stroke-linecap="round" stroke-dasharray="28 520"><animate attributeName="stroke-dashoffset" values="548;0" dur="5.5s" repeatCount="indefinite"/></path>
<g fill="#C45A3C"><circle cx="80" cy="398" r="5"/><circle cx="258" cy="396" r="5"><animate attributeName="r" values="4;7;4" dur="2.4s" repeatCount="indefinite"/></circle></g><circle cx="438" cy="399" r="5" fill="#D8C6A5"/><text x="78" y="444" fill="#D8C6A5" font-family="Arial, sans-serif" font-size="12" letter-spacing="2">PEOPLE FIRST  ·  PRACTICAL SYSTEMS</text></g>
<g><rect x="505" y="178" width="430" height="294" rx="18" fill="#173437" stroke="#55706B" stroke-opacity=".65"/><rect x="505" y="178" width="430" height="4" rx="2" fill="#81927A"/>
