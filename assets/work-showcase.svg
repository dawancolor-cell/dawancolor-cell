<text x="535" y="276" fill="#F4F0E6" font-family="Georgia, serif" font-size="36">NextBorder Import</text><text x="535" y="310" fill="#B8C7BD" font-family="Arial, sans-serif" font-size="17">Turning import operations into</text><text x="535" y="334" fill="#B8C7BD" font-family="Arial, sans-serif" font-size="17">clearer dashboards and workflows.</text>
<g transform="translate(540 372)"><path d="M0 58H350" stroke="#F4F0E6" stroke-opacity=".18"/>
<rect x="8" y="31" width="34" height="27" rx="5" fill="#647A69"><animate attributeName="height" values="27;36;27" dur="4s" repeatCount="indefinite"/><animate attributeName="y" values="31;22;31" dur="4s" repeatCount="indefinite"/></rect>
<rect x="64" y="12" width="34" height="46" rx="5" fill="#C45A3C"><animate attributeName="height" values="46;54;46" dur="4s" begin=".4s" repeatCount="indefinite"/><animate attributeName="y" values="12;4;12" dur="4s" begin=".4s" repeatCount="indefinite"/></rect>
<rect x="120" y="22" width="34" height="36" rx="5" fill="#D8C6A5"><animate attributeName="height" values="36;44;36" dur="4s" begin=".8s" repeatCount="indefinite"/><animate attributeName="y" values="22;14;22" dur="4s" begin=".8s" repeatCount="indefinite"/></rect>
<rect x="176" y="5" width="34" height="53" rx="5" fill="#647A69"><animate attributeName="height" values="53;60;53" dur="4s" begin="1.2s" repeatCount="indefinite"/><animate attributeName="y" values="5;-2;5" dur="4s" begin="1.2s" repeatCount="indefinite"/></rect>
<rect x="232" y="27" width="34" height="31" rx="5" fill="#C45A3C"><animate attributeName="height" values="31;39;31" dur="4s" begin="1.6s" repeatCount="indefinite"/><animate attributeName="y" values="27;19;27" dur="4s" begin="1.6s" repeatCount="indefinite"/></rect>
<path d="M8 1H340" stroke="#D8C6A5" stroke-opacity=".24" stroke-dasharray="3 8"/><circle cx="326" cy="9" r="5" fill="#D8C6A5"><animate attributeName="opacity" values=".3;1;.3" dur="2s" repeatCount="indefinite"/></circle></g><text x="535" y="444" fill="#D8C6A5" font-family="Arial, sans-serif" font-size="12" letter-spacing="2">STRUCTURE  ·  CLARITY  ·  FLOW</text></g>
<g><rect x="962" y="178" width="430" height="294" rx="18" fill="#173437" stroke="#55706B" stroke-opacity=".65"/><rect x="962" y="178" width="430" height="4" rx="2" fill="#D8C6A5"/>
<g font-family="Arial, sans-serif" fill="#D8C6A5" font-size="13" letter-spacing="2.2"><text x="992" y="220">03  /  BUSINESS</text><text x="1360" y="220" text-anchor="end" fill="#81927A">BRAND BUILDING</text></g>
<text x="992" y="276" fill="#F4F0E6" font-family="Georgia, serif" font-size="38">Dawan Trade Link</text><text x="992" y="310" fill="#B8C7BD" font-family="Arial, sans-serif" font-size="17">Exploring business initiatives and</text><text x="992" y="334" fill="#B8C7BD" font-family="Arial, sans-serif" font-size="17">distinctive brand experiences.</text>
<g transform="translate(1178 408)"><circle r="43" fill="none" stroke="#D8C6A5" stroke-opacity=".32" stroke-width="1.5" stroke-dasharray="4 7"/><circle r="29" fill="none" stroke="#C45A3C" stroke-opacity=".8" stroke-width="2"/><g><circle cx="43" cy="0" r="6" fill="#C45A3C"/><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/></g><g><circle cx="-29" cy="0" r="4" fill="#D8C6A5"/><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="11s" repeatCount="indefinite"/></g><circle r="5" fill="#81927A"><animate attributeName="r" values="4;7;4" dur="2.6s" repeatCount="indefinite"/></circle></g><text x="992" y="444" fill="#D8C6A5" font-family="Arial, sans-serif" font-size="12" letter-spacing="2">IDENTITY  ·  TRUST  ·  EXPERIENCE</text></g>
<g fill="#AFC0B4" font-family="Arial, sans-serif" font-size="12" letter-spacing="2"><text x="62" y="510">IDEAS INTO USEFUL SYSTEMS</text><text x="1378" y="510" text-anchor="end">THOUGHTFUL BY DESIGN</text></g><path d="M62 522H1378" stroke="#F4F0E6" stroke-opacity=".16"/>
</svg>