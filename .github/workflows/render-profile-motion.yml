name: Render DAWAN profile motion

concurrency:
  group: dawan-profile-motion
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "assets/typography-motion.svg"
      - "assets/work-showcase.svg"
      - "assets/nextborder-founder-motion.svg"
      - "scripts/render_profile_motion.mjs"
      - ".github/workflows/render-profile-motion.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-banner:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install browser renderer
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Install optimized GIF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg gifsicle

      - name: Render SVG motion frames
        run: node scripts/render_profile_motion.mjs

      - name: Encode compact animated GIFs
        run: |
          ffmpeg -y -framerate 8 -i frames/frame-%03d.png \
            -filter_complex "[0:v]fps=8,scale=864:-1:flags=lanczos,split[s0][s1];[s0]palettegen=max_colors=64:stats_mode=diff[p];[s1][p]paletteuse=dither=bayer" \
            -loop 0 /tmp/typography-motion-raw.gif
          gifsicle --optimize=3 --lossy=45 /tmp/typography-motion-raw.gif \
            -o assets/typography-motion.gif

          ffmpeg -y -framerate 8 -i work-frames/frame-%03d.png \
            -filter_complex "[0:v]fps=8,scale=864:-1:flags=lanczos,split[s0][s1];[s0]palettegen=max_colors=64:stats_mode=diff[p];[s1][p]paletteuse=dither=bayer" \
            -loop 0 /tmp/work-showcase-raw.gif
          gifsicle --optimize=3 --lossy=45 /tmp/work-showcase-raw.gif \
            -o assets/work-showcase.gif

          ffmpeg -y -framerate 8 -i founder-frames/frame-%03d.png \
            -filter_complex "[0:v]fps=8,scale=720:-1:flags=lanczos,split[s0][s1];[s0]palettegen=max_colors=64:stats_mode=diff[p];[s1][p]paletteuse=dither=bayer" \
            -loop 0 /tmp/nextborder-founder-raw.gif
          gifsicle --optimize=3 --lossy=75 /tmp/nextborder-founder-raw.gif \
            -o assets/nextborder-founder-motion.gif

          ls -lh assets/typography-motion.gif assets/work-showcase.gif assets/nextborder-founder-motion.gif

      - name: Switch profile images to generated GIFs
        run: |
          python - <<'PY'
          from pathlib import Path

          readme = Path("README.md")
          content = readme.read_text()

          replacements = [
              (
                  '<img src="assets/typography-motion.svg" alt="Animated typography: People. Pathways. Systems." width="100%"/>',
                  '<img src="assets/typography-motion.gif" alt="Animated typography: People. Pathways. Systems." width="100%"/>'
              ),
              (
                  '<img src="assets/work-showcase.svg" alt="Three selected work areas: NextBorder, NextBorder Import and Dawan Trade Link" width="100%"/>',
                  '<img src="assets/work-showcase.gif" alt="Three selected work areas: NextBorder, NextBorder Import and Dawan Trade Link" width="100%"/>'
              ),
              (
                  '<img src="assets/nextborder-founder-motion.svg" alt="Ishak Dawan, Founder and CEO of Next Border. Crossing Boundaries. Building Futures." width="100%"/>',
                  '<img src="assets/nextborder-founder-motion.gif" alt="Ishak Dawan, Founder and CEO of Next Border. Crossing Boundaries. Building Futures." width="100%"/>'
              )
          ]

          for source, rendered in replacements:
              content = content.replace(source, rendered)

          readme.write_text(content)
          PY

      - name: Publish animated profile assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/typography-motion.gif assets/work-showcase.gif assets/nextborder-founder-motion.gif README.md
          if git diff --cached --quiet; then
            echo "The animated profile assets are already up to date."
          else
            git commit -m "Render and publish animated profile showcases"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
