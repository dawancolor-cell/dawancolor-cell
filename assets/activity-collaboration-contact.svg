  <text x="996" y="316" fill="#F5F3EA" font-family="Georgia,serif" font-size="30">Start a conversation</text>
  <text x="996" y="350" fill="#AEBCC2" font-family="Arial,sans-serif" font-size="15">GitHub · Next Border</text>
  <text x="996" y="391" fill="#D8C69A" font-family="Arial,sans-serif" font-size="12" letter-spacing="2">A CLEAR NEXT STEP</text>
</g>
<path d="M64 454H1376" stroke="#E8E6DD" stroke-opacity=".16"/>
<text x="64" y="477" fill="#94A3B8" font-family="Arial,sans-serif" font-size="11" letter-spacing="2">NO INVENTED COUNTS. NO SKILL SCORES. JUST THE WORK AND THE PEOPLE BEHIND IT.</text>
</svg>